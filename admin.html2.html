<!doctype html>
<html lang="ar" dir="rtl"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>لوحة تحكم PLAYGATE</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
<style>:root{--bg:#05060a;--bg2:#0b0e17;--card:#0e1320;--line:#1a2440;--blue:#1f6bff;--neon:#38b6ff;--text:#e8eefc;--mut:#8b98b8;--ok:#27d98a;--warn:#ffb84a}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Tajawal',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.7;min-height:100vh}
a{color:inherit;text-decoration:none}button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:0 18px}
:focus-visible{outline:2px solid var(--neon);outline-offset:2px}
header{position:sticky;top:0;z-index:20;background:rgba(5,6,10,.85);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.nav{display:flex;align-items:center;gap:14px;height:64px}
.logo{font-weight:900;font-size:26px;letter-spacing:3px;color:#fff;text-shadow:0 0 14px var(--blue),0 0 32px var(--blue)}
.logo b{color:var(--neon)}
.search{flex:1;max-width:420px;margin-inline-start:auto}
.search input{width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:9px 14px;margin:0}
.search input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(31,107,255,.25);outline:0}
.btn{background:var(--blue);border:0;border-radius:12px;padding:10px 18px;font-weight:700;cursor:pointer;color:#fff;transition:.25s}
.btn:hover{box-shadow:0 0 22px rgba(31,107,255,.7);transform:translateY(-1px)}
.btn:disabled{opacity:.4;cursor:not-allowed;box-shadow:none;transform:none}
.btn.ghost{background:transparent;border:1px solid var(--line)}.btn.ghost:hover{border-color:var(--neon)}
.btn.sm{padding:6px 12px;font-size:14px}.btn.danger{background:#d63a4a}
.cartbtn{position:relative}.cartbtn span{position:absolute;top:-6px;inset-inline-end:-6px;background:var(--neon);color:#001;border-radius:99px;font-size:12px;min-width:20px;height:20px;display:grid;place-items:center;font-weight:800}
.hero{padding:84px 0 56px;text-align:center;background:radial-gradient(ellipse at 50% 0,rgba(31,107,255,.35),transparent 60%)}
.hero h1{font-size:clamp(34px,7vw,68px);font-weight:900;line-height:1.2;text-shadow:0 0 30px rgba(31,107,255,.7);animation:rise .9s ease both}
.hero p{color:var(--mut);margin:14px 0 6px;font-size:18px}
@keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
.cats{display:flex;gap:8px;overflow-x:auto;padding:14px 0 4px;scrollbar-width:none}
.chip{white-space:nowrap;padding:7px 16px;border:1px solid var(--line);border-radius:99px;background:var(--bg2);cursor:pointer;transition:.2s}
.chip:hover,.chip.on{border-color:var(--neon);color:var(--neon);box-shadow:0 0 14px rgba(56,182,255,.3)}
section{padding:34px 0}
h2{font-size:26px;margin-bottom:18px;padding-inline-start:12px;border-inline-start:4px solid var(--blue)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;transition:.25s;cursor:pointer}
.card:hover{border-color:var(--blue);box-shadow:0 0 26px rgba(31,107,255,.3);transform:translateY(-3px)}
.thumb{aspect-ratio:4/3;background:linear-gradient(135deg,#0a1a4a,#1f6bff 60%,#38b6ff);display:grid;place-items:center;font-size:44px;font-weight:900;position:relative}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tag{position:absolute;top:10px;inset-inline-start:10px;background:var(--warn);color:#201400;font-size:12px;font-weight:800;padding:2px 10px;border-radius:99px;z-index:1}
.cb{padding:14px;display:flex;flex-direction:column;gap:6px;flex:1}
.cb p{color:var(--mut);font-size:14px;flex:1}
.price{font-weight:800;color:var(--neon);font-size:18px}.price s{color:var(--mut);font-weight:400;font-size:14px;margin-inline-start:6px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;place-items:center;z-index:50;padding:16px}
.modal.open{display:grid}
.box{background:var(--bg2);border:1px solid var(--blue);border-radius:18px;padding:22px;width:100%;max-width:520px;max-height:90vh;overflow:auto;box-shadow:0 0 40px rgba(31,107,255,.35)}
.drawer{position:fixed;top:0;bottom:0;inset-inline-end:0;width:min(400px,100%);background:var(--bg2);border-inline-start:1px solid var(--blue);z-index:60;transform:translateX(105%);transition:.3s;padding:18px;display:flex;flex-direction:column;gap:12px}
[dir=rtl] .drawer{transform:translateX(-105%)}
.drawer.open,[dir=rtl] .drawer.open{transform:none}
.items{flex:1;overflow:auto;display:flex;flex-direction:column;gap:10px}
.item{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:6px}
.qty{display:flex;align-items:center;gap:8px}.qty button{width:28px;height:28px;border-radius:8px;border:1px solid var(--line);background:var(--bg);cursor:pointer}
input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 12px;margin:4px 0 10px}
label{font-size:14px;color:var(--mut)}
.notice{background:rgba(255,184,74,.1);border:1px solid var(--warn);border-radius:10px;padding:10px;font-size:14px;margin:8px 0}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--blue);padding:10px 20px;border-radius:12px;z-index:99;box-shadow:0 0 24px var(--blue)}
footer{border-top:1px solid var(--line);padding:26px 0;color:var(--mut);text-align:center;font-size:14px;margin-top:30px}
.wa{position:fixed;bottom:18px;inset-inline-start:18px;background:#25d366;color:#062;font-weight:800;border-radius:99px;padding:11px 18px;z-index:30;box-shadow:0 0 20px rgba(37,211,102,.5)}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:9px;border-bottom:1px solid var(--line);text-align:start;vertical-align:top}
.scroll{overflow-x:auto}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:20px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}.stat b{display:block;font-size:26px;color:var(--neon)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(max-width:600px){.search{display:none}.hero{padding:56px 0 36px}.grid{grid-template-columns:repeat(2,1fr);gap:10px}}
</style></head>
<body>
<header><div class="wrap nav"><span class="logo">PLAY<b>GATE</b></span><span style="margin-inline-start:auto"></span><button class="btn ghost sm" id="out" hidden>خروج</button></div></header>
<main class="wrap" id="app">
  <form class="box" id="login" style="margin:60px auto">
    <h2>دخول الإدارة</h2>
    <label for="em">البريد</label><input id="em" type="email" value="farhan77l00@gmail.com" required autocomplete="username">
    <label for="pw">كلمة المرور</label><input id="pw" type="password" required autocomplete="current-password">
    <button class="btn" style="width:100%">دخول</button><p id="err" style="color:#ff7a88;margin-top:8px"></p>
  </form>
  <div id="panel" hidden>
    <div class="tabs"><button class="btn sm" data-tab="stats">الإحصائيات</button><button class="btn ghost sm" data-tab="orders">الطلبات</button><button class="btn ghost sm" data-tab="products">المنتجات والعروض</button><button class="btn ghost sm" data-tab="customers">العملاء</button><button class="btn ghost sm" data-tab="settings">الإعدادات</button></div>
    <div id="view"></div>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.min.js"></script>
<script>// ضع بيانات مشروعك من Supabase > Project Settings > API
// المفتاح anon آمن للنشر العلني لأن الحماية تتم عبر RLS. لا تضع service_role هنا أبداً.
window.PG_CONFIG = {
  SUPABASE_URL: 'https://yixpldgxiwihcenaiyob.supabase.co',
  SUPABASE_ANON_KEY: 'sb_publishable_P7Qfz6lM7Ml9JmXQpoyOEA_HdXzP4Mi',
  WHATSAPP: '966500000000'   // يُستبدل بقيمة جدول settings عند توفرها
};

const CFG = window.PG_CONFIG;
const DEMO = !CFG.SUPABASE_URL || CFG.SUPABASE_URL.startsWith('YOUR');
const sb = DEMO ? null : supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY);
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = n => new Intl.NumberFormat('ar-SA', {style:'currency', currency:'SAR'}).format(n);
const STATUS = {pending_payment:'بانتظار الدفع', pending_verification:'بانتظار التحقق', payment_confirmed:'تم تأكيد الدفع', completed:'مكتمل'};
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.append(t);setTimeout(()=>t.remove(),2600)}

const view = $('#view');
if (DEMO) $('#err').textContent = 'اضبط js/config.js وSupabase أولاً.';
$('#login').onsubmit = async e => {
  e.preventDefault(); if (DEMO) return;
  const {error} = await sb.auth.signInWithPassword({email: $('#em').value, password: $('#pw').value});
  if (error) return $('#err').textContent = 'بيانات الدخول غير صحيحة';
  boot();
};
$('#out').onclick = async () => { await sb.auth.signOut(); location.reload(); };
async function boot() {
  if (DEMO) return;
  const {data:{user}} = await sb.auth.getUser(); if (!user) return;
  const {data} = await sb.from('admins').select('user_id').eq('user_id', user.id);
  if (!data?.length) { await sb.auth.signOut(); return $('#err').textContent = 'هذا الحساب ليس مديراً'; }
  $('#login').hidden = true; $('#panel').hidden = false; $('#out').hidden = false; stats();
}
const TABS = {stats: () => stats(), orders: () => orders(), products: () => products(), customers: () => customers(), settings: () => settings()};

async function stats() {
  const {data} = await sb.from('orders').select('total,status,created_at');
  const paid = data.filter(o => ['payment_confirmed','completed'].includes(o.status));
  const rev = paid.reduce((s, o) => s + +o.total, 0), month = new Date().toISOString().slice(0, 7);
  const mrev = paid.filter(o => o.created_at.startsWith(month)).reduce((s, o) => s + +o.total, 0);
  view.innerHTML = `<div class="stats"><div class="stat">إجمالي الإيرادات<b>${money(rev)}</b></div><div class="stat">إيراد هذا الشهر<b>${money(mrev)}</b></div><div class="stat">كل الطلبات<b>${data.length}</b></div><div class="stat">بانتظار الدفع/التحقق<b>${data.filter(o => o.status.startsWith('pending')).length}</b></div></div><p>الإيراد يُحسب من الطلبات ذات الدفع الموثّق فقط.</p>`;
}
async function orders() {
  const {data} = await sb.from('orders').select('*, payments(verified)').order('created_at', {ascending:false});
  view.innerHTML = `<div class="scroll"><table><tr><th>الطلب</th><th>العميل</th><th>المنتجات</th><th>الإجمالي</th><th>الحالة</th><th></th></tr>${data.map(o => `<tr><td>${esc(o.order_no)}<br><small>${new Date(o.created_at).toLocaleString('ar-SA')}</small></td><td>${esc(o.customer_name)}<br><a href="https://wa.me/${esc(o.customer_phone)}" target="_blank" rel="noopener">${esc(o.customer_phone)}</a></td><td>${o.items.map(i => esc(i.name) + ' ×' + i.qty).join('<br>')}</td><td>${money(o.total)}</td>
   <td><select data-st="${o.id}">${Object.entries(STATUS).map(([k, v]) => `<option value="${k}" ${k === o.status ? 'selected' : ''}>${v}</option>`).join('')}</select></td>
   <td>${o.payments.some(p => p.verified) ? '✔ موثّق' : `<button class="btn sm" data-pay="${o.id}" data-amt="${o.total}">توثيق الدفع</button>`}</td></tr>`).join('')}</table></div>`;
}
async function products() {
  const {data} = await sb.from('products').select('*').order('created_at', {ascending:false});
  view.innerHTML = `<form id="pf" class="box" style="max-width:none;margin-bottom:18px"><h3>إضافة / تعديل منتج</h3><input type="hidden" id="pid">
   <input id="pn" placeholder="اسم اللعبة" required><input id="pd" placeholder="وصف مختصر"><textarea id="pt" placeholder="التفاصيل وطريقة الاستلام"></textarea>
   <div class="row"><input id="pp" type="number" step="0.01" min="0" placeholder="السعر (ر.س)" required><input id="po" type="number" step="0.01" min="0" placeholder="السعر قبل الخصم (للعروض)"></div>
   <input id="pc" placeholder="التصنيف"><label>صورة المنتج</label><input id="pi" type="file" accept="image/*">
   <label><input type="checkbox" id="pfe" style="width:auto"> مميز</label> <label><input type="checkbox" id="pof" style="width:auto"> عرض</label> <label><input type="checkbox" id="pa" style="width:auto" checked> مفعّل</label>
   <br><button class="btn">حفظ</button></form>
   <div class="scroll"><table><tr><th>المنتج</th><th>السعر</th><th>الحالة</th><th></th></tr>${data.map(p => `<tr><td>${esc(p.name)}</td><td>${money(p.price)}${p.old_price ? ` <s>${money(p.old_price)}</s>` : ''}</td><td>${p.active ? 'مفعّل' : 'مخفي'} ${p.is_offer ? '· عرض' : ''}</td><td><button class="btn ghost sm" data-edit="${esc(JSON.stringify(p))}">تعديل</button> <button class="btn danger sm" data-rm="${p.id}">حذف</button></td></tr>`).join('')}</table></div>`;
  $('#pf').onsubmit = saveProduct;
}
async function saveProduct(e) {
  e.preventDefault();
  const row = {name: $('#pn').value, description: $('#pd').value, details: $('#pt').value, price: +$('#pp').value, old_price: $('#po').value ? +$('#po').value : null, category: $('#pc').value || 'ألعاب', featured: $('#pfe').checked, is_offer: $('#pof').checked, active: $('#pa').checked};
  const f = $('#pi').files[0];
  if (f) {
    const path = crypto.randomUUID() + '.' + f.name.split('.').pop();
    const up = await sb.storage.from('product-images').upload(path, f); if (up.error) return toast(up.error.message);
    row.image_url = sb.storage.from('product-images').getPublicUrl(path).data.publicUrl;
  }
  const id = $('#pid').value;
  const {error} = id ? await sb.from('products').update(row).eq('id', id) : await sb.from('products').insert(row);
  error ? toast(error.message) : (toast('تم الحفظ'), products());
}
async function customers() {
  const [c, o] = await Promise.all([sb.from('customers').select('*').order('created_at', {ascending:false}), sb.from('orders').select('customer_id,total')]);
  view.innerHTML = `<div class="scroll"><table><tr><th>الاسم</th><th>الجوال</th><th>الطلبات</th><th>المشتريات</th></tr>${c.data.map(x => { const mine = o.data.filter(r => r.customer_id === x.id); return `<tr><td>${esc(x.name)}</td><td>${esc(x.phone)}</td><td>${mine.length}</td><td>${money(mine.reduce((s, r) => s + +r.total, 0))}</td></tr>`; }).join('')}</table></div>`;
}
async function settings() {
  const {data} = await sb.from('settings').select('*'); const m = Object.fromEntries(data.map(r => [r.key, r.value]));
  view.innerHTML = `<form class="box" id="sf" style="max-width:none"><label>رقم واتساب (بصيغة دولية بدون +)</label><input id="sw" value="${esc(m.whatsapp)}"><label>بيانات التحويل البنكي (اتركها فارغة إن لم تتوفر)</label><textarea id="sbk">${esc(m.bank_info)}</textarea><button class="btn">حفظ</button></form>`;
  $('#sf').onsubmit = async e => { e.preventDefault(); await sb.from('settings').upsert([{key:'whatsapp', value:$('#sw').value}, {key:'bank_info', value:$('#sbk').value}]); toast('تم الحفظ'); };
}
document.addEventListener('click', async e => {
  const d = e.target.dataset;
  if (d.tab) { document.querySelectorAll('[data-tab]').forEach(b => b.className = 'btn sm' + (b.dataset.tab === d.tab ? '' : ' ghost')); TABS[d.tab](); }
  if (d.edit) { const p = JSON.parse(d.edit); $('#pid').value = p.id; $('#pn').value = p.name; $('#pd').value = p.description || ''; $('#pt').value = p.details || ''; $('#pp').value = p.price; $('#po').value = p.old_price || ''; $('#pc').value = p.category || ''; $('#pfe').checked = p.featured; $('#pof').checked = p.is_offer; $('#pa').checked = p.active; scrollTo(0, 0); }
  if (d.rm && confirm('حذف المنتج نهائياً؟')) { const {error} = await sb.from('products').delete().eq('id', d.rm); error ? toast(error.message) : products(); }
  if (d.pay) {
    const ref = prompt('أدخل مرجع العملية بعد التأكد من وصول المبلغ فعلياً في الحساب أو البوابة:'); if (!ref) return;
    const {data:{user}} = await sb.auth.getUser();
    const r = await sb.from('payments').insert({order_id: d.pay, method: 'manual', reference: ref, amount: d.amt, verified: true, verified_by: user.id});
    if (r.error) return toast(r.error.message);
    await sb.from('orders').update({status: 'payment_confirmed'}).eq('id', d.pay); toast('تم توثيق الدفع'); orders();
  }
});
document.addEventListener('change', async e => {
  const id = e.target.dataset.st; if (!id) return;
  const {error} = await sb.from('orders').update({status: e.target.value}).eq('id', id);
  if (error) { toast(error.message); orders(); } else toast('تم تحديث الحالة');
});
if (!DEMO) boot();
</script>
</body></html>
